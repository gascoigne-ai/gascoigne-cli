# Flow: receiver → filters → router → optimizers → exporters.
# Originals of optimized payloads land in the ledger: `gascoigne raw <id>`.
extensions:
  ledger: { raw_ttl: 24h } # path default: $XDG_DATA_HOME/gascoigne/ledger.db

receivers:
  stdin: { kind: cmd_output }
  exec: { kind: cmd_output } # gascoigne exec -- <cmd>
  hook: { kind: cmd_output } # gascoigne hook codex: output an agent already captured
  mcp: { fetch_timeout: 20s, fetch_max_bytes: 5242880 } # gascoigne mcp
  mcp_proxy: { retrieve: gascoigne_retrieve }           # gascoigne mcp-proxy -- <server cmd>

filters:
  bypass: {}                   # attr raw=true or GASCOIGNE_RAW=1
  minsize: { min_tokens: 200 } # small payloads are not worth it
  history: { max_failures: 1 } # skip sources that optimized badly before
  detect: {}                   # tag each block with its content type

# Optimizers select the blocks whose detected type they understand, so one
# default chain serves every input. Add routes only to override per command.
router:
  default: [task, test, build, git, grep, ls, json, data, log, cat, pkg, table, db, k8s, cloud, infra, http, html, doc]

optimizers:
  test: {}
  build: { max_frame: 4 }
  git: { context_lines: 1, max_file_lines: 200 }
  grep: { max_per_file: 20, max_files: 100, max_line_len: 160 }
  ls: { sizes_up_to: 60, width: 120, max_per_dir: 12 }
  # json: lossless table first; else sample long arrays keeping errors, anomalies,
  # change points, query matches (-attr query=...) and both ends
  json:
    drop_empty: true
    max_string: 300
    shorten_hashes: true
    tabulate_min: 3
    lossless_min_saving: 0.3
    lossless_max_tokens: 1500
    min_items: 5
    min_tokens: 200
    max_items: 15
    head_share: 0.3
    tail_share: 0.15
    anomaly_std: 2
    relevance_k: 3
  log: { context: 2, drop_debug: true, max_lines: 300 }
  # mode auto|full|clean|outline; per run: -attr cat_mode=full or GASCOIGNE_CAT_MODE
  cat: { mode: auto, clean_min_tokens: 800, outline_min_tokens: 4000, min_body: 4 }
  pkg: {}
  data: { max_rows: 30, max_cell: 60, max_items: 20 } # yaml, csv, xml, toml; json: crusher keys for yaml
  table: { max_rows: 30, max_cell: 60 }
  db: { max_rows: 30, max_cell: 80, plan_min_share: 0.02 }
  k8s: { max_items: 15, max_rows: 30, max_cell: 60, notes_lines: 8 }
  cloud: { max_rows: 30, max_cell: 60, max_objects: 30 } # json: same keys as the json optimizer
  infra: { max_plan_lines: 300, diff_context: 3 }
  task: {}
  http: { links: true } # drop_headers: transport headers removed; json: crusher keys for bodies
  html: { links: true }
  doc: { max_code_lines: 40 } # man_drop: man sections dropped as boilerplate

exporters:
  stdout: { hint: true }

pipelines:
  cli:
    receivers: [stdin]
    filters: [bypass, detect, minsize, history]
    exporters: [stdout]
  exec:
    receivers: [exec]
    filters: [bypass, detect, minsize, history]
    exporters: [stdout]
  # Hook and MCP pipelines have no exporters: results go back to the agent, and
  # stdout is the protocol channel.
  hook:
    receivers: [hook]
    filters: [bypass, detect, minsize, history]
  mcp:
    receivers: [mcp]
    filters: [bypass, detect, minsize, history]
  mcp-proxy:
    receivers: [mcp_proxy]
    filters: [bypass, detect, minsize, history]
