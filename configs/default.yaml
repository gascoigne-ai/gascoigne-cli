# Flow: receiver → filters → router → optimizers → exporters.
# Originals of optimized payloads land in the ledger: `gascoigne raw <id>`.
extensions:
  ledger: { raw_ttl: 24h } # path default: $XDG_DATA_HOME/gascoigne/ledger.db

receivers:
  stdin: { kind: cmd_output }

filters:
  bypass: {}                   # attr raw=true or GASCOIGNE_RAW=1
  minsize: { min_tokens: 200 } # small payloads are not worth it
  history: { max_failures: 1 } # skip sources that optimized badly before
  detect: {}                   # tag each block with its content type

# Optimizers select the blocks whose detected type they understand, so one
# default chain serves every input. Add routes only to override per command.
router:
  default: [go, git, grep]

optimizers:
  go: {}
  git: { context_lines: 1, max_file_lines: 200 }
  grep: { max_per_file: 20, max_files: 100, max_line_len: 160 }

exporters:
  stdout: { hint: true }

pipelines:
  cli:
    receivers: [stdin]
    filters: [bypass, detect, minsize, history]
    exporters: [stdout]
