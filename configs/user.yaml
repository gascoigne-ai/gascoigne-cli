## gascoigne config
##
## Every setting is listed here, commented out: the built-in defaults apply. To change one,
## uncomment it together with its parent keys. This file is laid over the defaults: maps merge
## key by key, a value or a list you set replaces the default one.
##
##   gascoigne config        print the effective config
##   docs/configuration.md   what each option does
##
## Per run, without editing this file: -set path=yaml, -only a,b, -disable a,b (or
## GASCOIGNE_SET, GASCOIGNE_ONLY, GASCOIGNE_DISABLE in an agent's environment).

## Shared services.
# extensions:
#   ledger:
#     path: ""        ## sqlite file; "" = $XDG_DATA_HOME/gascoigne/ledger.db ($GASCOIGNE_LEDGER wins)
#     raw_ttl: 24h    ## how long originals stay retrievable; 0 keeps them forever
#     stats_ttl: 336h ## how long the daily per-tool MCP stats stay (two weeks); 0 keeps them forever

## Where input comes from.
# receivers:
#   stdin: { kind: cmd_output }       ## gascoigne run
#   exec: { kind: cmd_output }        ## gascoigne exec -- <cmd>
#   hook: { kind: cmd_output }        ## gascoigne hook codex: output an agent already captured
#   mcp:                              ## gascoigne mcp
#     ledger: ledger                  ## extension serving retrieve and stats
#     retrieve: retrieve              ## name of the tool returning originals
#     fetch_timeout: 20s              ## time limit for one fetch
#     fetch_max_bytes: 5242880        ## response bytes read by fetch
#   mcp_proxy:                        ## gascoigne mcp-proxy -- <server cmd>
#     command: []                     ## downstream server; the CLI passes it after -- instead
#     url: ""                         ## remote server (http/https) instead of command; the CLI passes -url
#     sse: false                      ## url speaks legacy SSE instead of streamable HTTP
#     headers: {}                     ## sent with every request to url, e.g. Authorization
#     ledger: ledger
#     retrieve: gascoigne_retrieve    ## added tool; must not clash with downstream tools
#     compact_tools: true             ## tool schemas: drop titles restating names, $schema markers
#     max_tools: 0                    ## >0: more tools than this → search_tools + call_tool (agents without tool search)
#   httpproxy:                        ## LLM API proxy in the background server (/v1/, base URL http://127.0.0.1:7878)
#     anthropic: https://api.anthropic.com
#     openai: https://api.openai.com
#     gemini: https://generativelanguage.googleapis.com
#     bedrock: https://bedrock-runtime.{region}.amazonaws.com  ## Claude on Bedrock (Bedrock API key auth); e.g. a VPC endpoint
#     skip: [Edit, MultiEdit, Write, NotebookEdit, TodoWrite, ExitPlanMode, AskUserQuestion, apply_patch]  ## tools never touched
#     cache_entries: 50000            ## tool results remembered by hash: later requests send the same bytes
#     ledger: ledger                  ## keeps originals of folded results (folding needs it)
#     fold_min_lines: 3               ## run an earlier result of the request shows → pointer line; 0: off
#     fold_min_chars: 80              ## fewest bytes such a run must have
#     compact_tools: true             ## tool schemas: drop titles restating names, $schema markers
#     skill_code_lines: 30            ## skill bodies: longer code blocks keep head + pointer (raw -lines); 0: off
#     max_image_pixels: 0             ## >0: downscale tool-result screenshots above this many pixels

## Continue or bypass optimization.
# filters:
#   bypass: { env: GASCOIGNE_RAW }    ## variable that, when truthy, bypasses everything
#   detect:                           ## tags each block with its family/dialect type
#     edit_safe: [data, k8s, cloud, infra]  ## files of these read from disk (cat, sed -n, Read) stay in their syntax
#     edit_safe_max_tokens: 4000      ## ...when smaller than this; bigger ones (lockfiles, dumps) are crushed
#   minsize: { min_tokens: 200 }      ## smaller payloads are not worth it
#   history:                          ## skip sources that optimized badly before
#     ledger: ledger
#     max_failures: 1                 ## reset one with: gascoigne forget <key>

