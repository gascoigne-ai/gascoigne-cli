## Where results go.
# exporters:
#   stdout: { hint: true }            ## add "[gascoigne: optimized A→B tokens · full: gascoigne raw <id>]"

## Which optimizers run. Each picks the blocks whose type it knows, so one chain serves all.
# router:
#   routes: []                        ## e.g. - { name: big-logs, match: { content: "log/*", min_tokens: 2000 }, optimizers: [log] }
#   default: [task, test, build, git, grep, ls, json, data, log, cat, pkg, table, db, k8s, cloud, infra, http, html, doc, paths, truncate]

## Pipelines: which receivers, filters and exporters each command uses.
# pipelines:
#   cli: { receivers: [stdin], filters: [bypass, detect, minsize, history], exporters: [stdout] }
#   exec: { receivers: [exec], filters: [bypass, detect, minsize, history], exporters: [stdout] }
#   hook: { receivers: [hook], filters: [bypass, detect, minsize, history] }
#   mcp: { receivers: [mcp], filters: [bypass, detect, minsize, history] }
#   mcp-proxy: { receivers: [mcp_proxy], filters: [bypass, detect, minsize, history] }
