## Where results go.
# exporters:
#   stdout: { hint: true }            ## add "[gascoigne: optimized A→B tokens · full: gascoigne raw <id>]"

## Which optimizers run. Each picks the blocks whose type it knows, so one chain serves all.
# router:
#   routes: []                        ## e.g. - { name: big-logs, match: { content: "log/*", min_tokens: 2000 }, optimizers: [log] }
#   default: [embedjson, trace, task, test, build, git, grep, ls, json, data, log, cat, pkg, table, db, k8s, cloud, infra, http, html, aria, doc, dense, paths, truncate, rerun]

## Experimental commands to enable: prompts, or all. GASCOIGNE_EXPERIMENTAL adds to the list.
# experimental: []

## Exact token counts for gascoigne tokens, beside its estimates.
# tokenizers:
#   anthropic_api_key: ""             ## Claude counts via count_tokens; "" uses $ANTHROPIC_API_KEY (keep this file private)
#   anthropic_model: claude-opus-5-5  ## model whose tokenizer counts
#   o200k: true                       ## GPT-4o family encoding; vocabulary (3.6 MB) downloaded once to the cache dir

## Pipelines: which receivers, filters and exporters each command uses.
# pipelines:
#   cli: { receivers: [stdin], filters: [bypass, detect, minsize, history], exporters: [stdout] }
#   exec: { receivers: [exec], filters: [bypass, detect, minsize, history], exporters: [stdout] }
#   hook: { receivers: [hook], filters: [bypass, detect, minsize, history] }
#   mcp: { receivers: [mcp], filters: [bypass, detect, minsize, history] }
#   mcp-proxy: { receivers: [mcp_proxy], filters: [bypass, detect, minsize, history] }
#   proxy: { receivers: [httpproxy], filters: [bypass, detect, minsize, history] }
