<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gascoigne · Costs</title>
<link rel="stylesheet" href="/assets/pages.css">
<script src="/assets/pages.js"></script>
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div class="toolbar">
    <label>Period
      <select id="since">
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="14d" selected>Last 14 days</option>
        <option value="30d">Last 30 days</option>
        <option value="90d">Last 90 days</option>
        <option value="">All time</option>
      </select>
    </label>
    <div class="spacer"></div>
    <p class="hint">What the tokens gascoigne saved would have cost: once when read, and again each time a later request re-reads them from the cache.</p>
    <p class="hint" id="pricing"></p>
  </div>
  <div id="body"><p class="empty">Loading…</p></div>
  <footer>API-equivalent estimates, not what you pay: a subscription does not bill per token. Requests measured through the LLM proxy are on the Context page.</footer>
</div>
<script>
"use strict";
const { el, human, usd, num } = G;
G.header(document.getElementById("top"), "Costs", "What the saved tokens are worth, per model", "costs");
const getJSON = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(await r.text()); return r.json(); };

const panel = (title, hint, ...kids) => el("section", { class: "panel" }, el("h2", { text: title }), hint ? el("p", { class: "hint", text: hint }) : null, ...kids);
const th = (text, n) => el("th", { class: n ? "num" : "", scope: "col", text });
const td = (text, n) => el("td", { class: n ? "num" : "", text: String(text) });
const table = (head, rows, empty) => rows.length
  ? el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...head.map(([t, n]) => th(t, n)))), el("tbody", {}, ...rows.map((r) => el("tr", {}, ...r.map((c, i) => td(c, head[i][1])))))))
  : el("p", { class: "empty", text: empty });
const kpi = (name, value, plain, accent) => el("div", { class: "kpi" + (accent ? " accent" : "") }, el("div", { class: "name", text: name }), el("div", { class: "value", text: value }), el("div", { class: "plain", text: plain || "" }));

function render(c) {
  if (c.billing === "subscription") {
    document.getElementById("body").replaceChildren(panel("Dollars are hidden", "Your agents are on a flat plan, which bills nothing per token, so tokens saved are not turned into dollars. The Dashboard page has the tokens saved. If you pay per token, say so under Pricing.", pricingPanel()));
    document.getElementById("pricing").replaceChildren();
    return;
  }
  const rows = c.savings || [];
  const planNote = c.billing === "mixed" ? el("p", { class: "hint", text: "Left out of these dollars, because they are on a flat plan: " + (c.subscription_agents || []).join(", ") + "." }) : null;
  const none = "No priced savings in this period.";
  const kpis = el("section", { class: "kpis", "aria-label": "Summary" },
    kpi("Worth in context", usd(c.in_context_usd || 0), "saved tokens re-read by later requests, assuming " + (c.rereads || 0) + " rereads each (a median; the mean is higher)", true),
    kpi("Worth as first read", usd(c.first_read_usd || 0), "each saved token counted once"),
    kpi("Priced from an assumed model", (c.in_context_usd ? Math.round(100 * rows.filter((s) => s.assumed).reduce((n, s) => n + s.in_context_usd, 0) / c.in_context_usd) : 0) + "%", "runs that recorded no model"));
  const mod = panel("By model", "Saved is counted the way that model's tokenizer counts it. Runs that recorded no model use the agent's default, marked assumed.", table([["Model"], ["Price from"], ["Tokenizer"], ["Saved", true], ["First read", true], ["In context", true]],
    rows.map((s) => [s.model + (s.assumed ? " (assumed)" : ""), s.source || "built-in", s.tokenizer + (s.family === "gemini" ? " (factor not measured)" : ""), human(s.model_tokens), usd(s.first_read_usd), usd(s.in_context_usd)]), none));
  const assumedUSD = rows.filter((s) => s.assumed).reduce((n, s) => n + s.in_context_usd, 0);
  const assumedNote = assumedUSD > 0 && c.in_context_usd > 0
    ? el("p", { class: "hint", text: Math.round(100 * assumedUSD / c.in_context_usd) + "% of the in-context figure is for runs that recorded no model, priced as the agent's usual model." }) : null;
  const unpriced = c.unpriced && c.unpriced.length ? el("p", { class: "hint", text: "No known price, left out of the dollars: " + c.unpriced.join(", ") }) : null;
  const how = panel("How to read this", "",
    el("ul", { class: "plain cols" },
      el("li", { text: "Model: the model a run used. The proxy sees it in the API request, the Claude hook reads it from the transcript; with neither, the agent's usual model is assumed." }),
      el("li", { text: "Tokenizer: each vendor counts tokens differently, so the same text is a different number of tokens per model. Saved is in that model's units." }),
      el("li", { text: "First read: what the saved tokens would have cost once. In context: plus the later requests that read them again from the cache." }),
      el("li", { text: "Not subtracted: the text gascoigne itself adds to a session (hook and server notes, a few hundred tokens). The Context page lists it under text added besides your prompts." }),
      el("li", { text: "Every dollar figure is API-equivalent: what the tokens cost at list prices, not what a plan or invoice charges." })));
  const worth = rows.length ? panel("Where the worth comes from", "In-context dollars per model: what the tokens gascoigne saved are worth once later requests re-read them. Orange bars are runs that recorded no model, priced as the agent's usual model.",
    G.hbars([...rows].sort((a, b) => b.in_context_usd - a.in_context_usd).map((s) => ({
      name: s.model + (s.assumed ? " (assumed)" : ""),
      parts: [{ value: s.in_context_usd, cls: s.assumed ? "assumed" : "", title: s.model }],
      fig: el("span", {}, el("b", { text: usd(s.in_context_usd) }), " · " + Math.round(100 * s.in_context_usd / (c.in_context_usd || 1)) + "%"),
    }))),
    el("p", { class: "legend" }, el("span", {}, el("i", { class: "legend-dot" }), "model recorded"), el("span", {}, el("i", { class: "legend-dot warn" }), "model assumed"))) : null;
  // replaceChildren turns a null into the text "null": leave the empty ones out.
  document.getElementById("body").replaceChildren(...[kpis, el("div", { class: "grid" }, ...[worth, mod].filter(Boolean)), planNote, assumedNote, unpriced, how, pricingPanel()].filter(Boolean));
  const p = c.pricing;
  document.getElementById("pricing").replaceChildren(...(p ? [`Dollar figures are ${p.basis}; prices checked ${p.checked}. Sources: `,
    ...p.sources.flatMap((s, i) => [i ? ", " : "", el("a", { href: s, target: "_blank", rel: "noopener", text: new URL(s).hostname })])] : []));
}

// Pricing is read-only here. The dashboard has no login, so the settings are changed on the setup
// page, which is behind a one-time link (the button below opens it), or with gascoigne pricing set.
let pricingView = null;
const pricingBox = el("div", { id: "pricing-box" });

async function postJSON(path) {
  const r = await fetch(path, { method: "POST" });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

const billingWords = { auto: "found out per agent", api: "pay per token, for every agent", subscription: "a flat plan, for every agent" };

function drawPricing(message) {
  const v = pricingView;
  if (!v) return;
  const status = el("p", { class: "hint pricing-status", role: "status", text: message || "" });
  const change = el("button", { type: "button", class: "primary", text: "Change pricing in setup" });
  change.addEventListener("click", async () => {
    try { window.open((await postJSON("/api/setup/link")).url, "_blank", "noopener"); } catch (e) { status.textContent = e.message; }
  });
  const run = v.remote ? el("button", { type: "button", text: "Run now" }) : null;
  if (run) run.addEventListener("click", async () => {
    status.textContent = "Running…";
    try { pricingView = await postJSON("/api/pricing/refresh"); drawPricing(pricingView.error || "Done."); load(); } catch (e) { status.textContent = e.message; }
  });
  const detected = v.detected.map((d) => el("li", { text: d.agent + ": " + (d.mode === "subscription" ? "flat plan, no dollars" : "pay per token") + " (" + d.why + ")" }));
  const layers = v.layers.length
    ? el("ul", { class: "plain" }, ...v.layers.map((l) => el("li", { text: l.name + ": " + l.models + " model" + (l.models === 1 ? "" : "s") + (l.fetched ? ", last good " + new Date(l.fetched).toLocaleString() : "") + (l.next ? ", next " + new Date(l.next).toLocaleString() : "") + (l.error ? " — error: " + l.error : "") })))
    : el("p", { class: "hint", text: "Built-in list prices (checked " + v.builtin_checked + ") apply; no prices of yours are set." });
  pricingBox.replaceChildren(...[
    el("p", { class: "hint", text: "Billing: " + (billingWords[v.billing] || v.billing) + "." }),
    v.billing === "auto" ? el("ul", { class: "plain" }, ...detected) : null,
    layers,
    el("div", { class: "pricing-form" }, change, run),
    status,
    ...(v.warnings || []).map((w) => el("p", { class: "hint pricing-status err", text: w })),
  ].filter(Boolean));
}

function pricingPanel() {
  if (!pricingView) loadPricing();
  return panel("Pricing", "Dollar figures only mean something when you pay per token. Agents on a flat plan are left out of them.", pricingBox);
}

async function loadPricing() {
  try { pricingView = await getJSON("/api/pricing"); drawPricing(); } catch (e) { pricingBox.replaceChildren(el("p", { class: "empty", text: "Could not load pricing: " + e.message })); }
}

async function load() {
  const q = new URLSearchParams();
  const since = document.getElementById("since").value;
  if (since) q.set("since", since);
  try {
    render(await getJSON("/api/costs?" + q));
  } catch (e) {
    document.getElementById("body").replaceChildren(el("p", { class: "empty", text: "Could not load: " + e.message }));
  }
}
document.getElementById("since").onchange = load;
load();
setInterval(load, 30000);
</script>
</body>
</html>
