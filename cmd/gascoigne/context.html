<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gascoigne · Context</title>
<link rel="stylesheet" href="/assets/pages.css">
<script src="/assets/pages.js"></script>
<style>
svg.spark { vertical-align: middle; }
svg.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div class="toolbar">
    <label>Period
      <select id="since">
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="14d" selected>Last 14 days</option>
        <option value="30d">Last 30 days</option>
        <option value="90d">Last 90 days</option>
      </select>
    </label>
    <div class="spacer"></div>
    <p class="hint">Read from Claude Code's own transcripts on this machine, at API list prices. Nothing leaves it and nothing is changed.</p>
  </div>
  <div id="body"><p class="empty">Reading transcripts…</p></div>
  <footer>Every request re-reads the whole conversation, so a session costs mostly requests times context, not the size of any one tool result.</footer>
</div>
<script>
"use strict";
const { el, human, usd, num } = G;
G.header(document.getElementById("top"), "Context", "How big conversations get, and what that costs", "context");
const NS = "http://www.w3.org/2000/svg";
const when = (s) => s ? new Date(s).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";

function spark(series, peak) {
  const w = 120, h = 26, svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "spark"); svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "context over the session, peak " + human(peak));
  if (series.length > 1) {
    const max = Math.max(...series, 1);
    const pts = series.map((v, i) => `${(i * (w - 2) / (series.length - 1) + 1).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(" ");
    const p = document.createElementNS(NS, "polyline"); p.setAttribute("points", pts); svg.append(p);
  }
  return svg;
}

const panel = (title, hint, ...kids) => el("section", { class: "panel" }, el("h2", { text: title }), hint ? el("p", { class: "hint", text: hint }) : null, ...kids);
const table = (head, rows) => el("div", { class: "scroll" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows)));
const th = (text, num) => el("th", { class: num ? "num" : "", scope: "col", text });
const share = (frac) => el("div", { class: "share" }, el("span", { text: Math.round(100 * frac) + "%" }), el("div", { class: "bar" }, el("span", { style: "width:" + Math.round(100 * frac) + "%" })));
const kpi = (name, value, plain, accent) => el("div", { class: "kpi" + (accent ? " accent" : "") }, el("div", { class: "name", text: name }), el("div", { class: "value", text: value }), el("div", { class: "plain", text: plain || "" }));

let report = null, sort = { col: 5, dir: "desc" };
// Columns sort by an accessor, never by the displayed text.
const cols = [
  { title: "Project", get: (s) => (s.project || "").toLowerCase(), show: (s) => s.project || "–", first: "asc" },
  { title: "Started", get: (s) => s.start, show: (s) => when(s.start), first: "desc" },
  { title: "Requests", get: (s) => s.turns, show: (s) => num(s.turns), num: true },
  { title: "Peak context", get: (s) => s.peak_context, show: (s) => human(s.peak_context), num: true },
  { title: "Compactions", get: (s) => s.compactions, show: (s) => String(s.compactions), num: true },
  { title: "Cost", get: (s) => s.priced ? s.cost_usd : -1, show: (s) => s.priced ? usd(s.cost_usd) : "?", num: true },
  { title: "Context over time", get: (s) => s.peak_context, show: (s) => spark(s.series, s.peak_context) },
];

function render() {
  const r = report, root = document.getElementById("body");
  const label = r.hours < 48 ? r.hours + " hours" : Math.round(r.hours / 24) + " days";
  if (!r.sessions.length) { root.replaceChildren(el("p", { class: "empty", text: "No Claude Code transcripts with usage in the last " + label + "." })); return; }
  const over200 = r.buckets.slice(2).reduce((n, b) => n + b.share, 0);
  const kpis = el("section", { class: "kpis", "aria-label": "Summary" },
    kpi("Sessions", num(r.sessions.length), "last " + label), kpi("Requests", num(r.turns), "model calls"),
    kpi("Cost", usd(r.cost_usd), "at API list prices", true), kpi("Above 200k context", Math.round(100 * over200) + "%", "of the cost"));

  const buckets = panel("Where the money goes", "Cost by the size of the conversation each request re-read",
    table(el("tr", {}, th("Context of a request"), th("Requests", true), th("Cost", true), th("Share of cost")),
      r.buckets.map((b) => el("tr", {}, el("td", { text: b.label }), el("td", { class: "num", text: num(b.turns) }), el("td", { class: "num", text: usd(b.cost_usd) }), el("td", {}, share(b.share))))));
  const rewrites = panel("Cache written again", "Context the previous request carried that this one did not read from the cache: the extra is what a rewrite cost over a read",
    table(el("tr", {}, th("Cause"), th("Requests", true), th("Tokens", true), th("Extra cost", true), th("Share", true)),
      r.cache_rewrites.map((w) => el("tr", {}, el("td", { text: w.cause }), el("td", { class: "num", text: num(w.turns) }), el("td", { class: "num", text: human(w.tokens) }),
        el("td", { class: "num", text: usd(w.cost_usd) }), el("td", { class: "num", text: (100 * w.share).toFixed(1) + "%" })))));

  const whatIf = panel("What compacting earlier would have saved", "Re-priced as if each conversation had been compacted when it reached the size",
    table(el("tr", {}, th("Compact when context reaches"), th("Sessions affected", true), th("Compactions", true), th("Would have saved", true)),
      r.what_if.map((w) => el("tr", {}, el("td", { text: "at " + human(w.threshold) }), el("td", { class: "num", text: String(w.sessions) }), el("td", { class: "num", text: String(w.compactions) }),
        el("td", { class: "num", text: usd(w.saved_usd) + " (" + Math.round(w.saved_pct) + "%)" })))),
    el("div", { class: "alert-box" }, el("p", { text: "Compacting saves tokens, not detail: the summary forgets what it leaves out. This is an upper bound on what is worth giving up, not advice to compact everywhere." })));

  const injected = panel("Text added besides your prompts", "Instruction files, the skill listing and what hooks and plugins print. It is written to the cache once and read again by every later request of the session",
    r.injected.length ? table(el("tr", {}, th("Source"), th("Times", true), th("Per time", true), th("Cost", true), th("Share of cost", true)),
      r.injected.slice(0, 12).map((x) => el("tr", {}, el("td", { text: x.source }), el("td", { class: "num", text: num(x.times) }), el("td", { class: "num", text: human(x.per_time) + " tokens" }),
        el("td", { class: "num", text: usd(x.cost_usd) }), el("td", { class: "num", text: (100 * x.share).toFixed(1) + "%" })))) : el("p", { class: "empty", text: "Nothing recorded in this period." }));

  const c = cols[sort.col];
  const sessions = [...r.sessions].sort((a, b) => { const x = c.get(a), y = c.get(b); const v = x < y ? -1 : x > y ? 1 : 0; return sort.dir === "asc" ? v : -v; }).slice(0, 60);
  const head = el("tr");
  cols.forEach((col, i) => {
    const h = el("th", { class: col.num ? "num" : "", scope: "col" });
    if (i === sort.col) h.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending");
    const b = el("button", { type: "button", text: col.title });
    b.addEventListener("click", () => { sort = { col: i, dir: sort.col === i ? (sort.dir === "asc" ? "desc" : "asc") : (col.first || "desc") }; render(); });
    h.append(b); head.append(h);
  });
  const sessionsPanel = panel("Sessions", r.sessions.length > 60 ? "The 60 matching the sort are shown. Click a heading to sort." : "Click a heading to sort.",
    table(head, sessions.map((s) => el("tr", {}, ...cols.map((col) => el("td", { class: col.num ? "num" : "" }, col.show(s)))))));

  const how = panel("How this is computed", "", el("ul", { class: "plain" }, ...r.assumptions.map((a) => el("li", { text: a }))),
    r.unpriced_sessions ? el("p", { class: "hint", text: r.unpriced_sessions + " sessions use a model without a known price and are left out of the dollars." }) : null);

  root.replaceChildren(kpis, el("div", { class: "grid" }, buckets, rewrites), whatIf, injected, sessionsPanel, how);
}

async function load() {
  const since = document.getElementById("since").value;
  history.replaceState(null, "", "?since=" + since);
  try {
    const res = await fetch("/api/context?since=" + since);
    if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
    report = await res.json();
    render();
  } catch (e) { document.getElementById("body").replaceChildren(el("p", { class: "empty", text: "Could not read transcripts: " + e.message })); }
}
const q = new URLSearchParams(location.search).get("since");
if (q && [...document.getElementById("since").options].some((o) => o.value === q)) document.getElementById("since").value = q;
document.getElementById("since").addEventListener("change", load);
load();
</script>
</body>
</html>
