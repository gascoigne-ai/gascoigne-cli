# Scale cases (make eval-scale): large outputs generated by `run:` with sh and awk
# (deterministic, nothing committed), so they show savings at size and catch slowdowns.
# `attrs.cmd` names the tool the output stands for (the generator is not the tool);
# the lines are synthetic in the shape of the real tool. Floors sit under what was
# measured; max_ms is about 10x the measured time, so only a real regression trips it.
# No golden or baseline (like live cases): the assertions are the record.
- name: go-test-v-5000
  run: |-
    awk 'BEGIN{for(i=1;i<=5000;i++){printf "=== RUN   TestCase%d\n--- PASS: TestCase%d (0.00s)\n",i,i}; print "PASS"; print "ok  \texample.com/big/pkg\t1.234s"}'
  attrs: { cmd: go test -v ./... }
  expect_type: test/go
  keep: ["5000 tests passed"]
  min_saved: 90
  max_ms: 500
- name: go-test-fail-in-3000
  run: |-
    awk 'BEGIN{for(i=1;i<=3000;i++){printf "=== RUN   TestCase%d\n--- PASS: TestCase%d (0.00s)\n",i,i}; print "=== RUN   TestBroken"; print "    broken_test.go:42: got 3, want 4"; print "--- FAIL: TestBroken (0.00s)"; print "FAIL"; print "FAIL\texample.com/big/pkg\t2.000s"}'
  attrs: { cmd: go test -v ./... }
  expect_type: test/go
  keep: ["--- FAIL: TestBroken", "broken_test.go:42: got 3, want 4", "FAIL\texample.com/big/pkg"]
  min_saved: 90
  max_ms: 500
- name: go-build-errors-3000
  run: |-
    awk 'BEGIN{for(i=1;i<=3000;i++) printf "./pkg/mod%d/file%d.go:%d:%d: undefined: helper%d\n",i%40,i%90,i%500+1,i%30+1,i%25}'
  attrs: { cmd: go build ./... }
  expect_type: build/go
  keep: ["undefined: helper3"]
  min_saved: 70
  max_ms: 1000
- name: rg-matches-20000
  run: |-
    awk 'BEGIN{for(i=1;i<=20000;i++) printf "src/module%d/file%d.go:%d:    return handle%d(ctx, req)\n",i%60,i%400,i%900+1,i%7}'
  attrs: { cmd: rg -n handle }
  expect_type: search/rg
  min_saved: 85
  max_ms: 1000
- name: find-paths-30000
  run: |-
    awk 'BEGIN{for(i=1;i<=30000;i++) printf "./services/svc%d/internal/pkg%d/file%d.go\n",i%30,i%120,i}'
  attrs: { cmd: find . -name "*.go" }
  expect_type: fs/find
  min_saved: 85
  max_ms: 1000
- name: ls-la-10000
  run: |-
    awk 'BEGIN{print "total 40000"; for(i=1;i<=10000;i++) printf "-rw-r--r-- 1 user user %d Oct 10 12:%02d file%05d.txt\n",i*13%9000,i%60,i}'
  attrs: { cmd: ls -la }
  expect_type: fs/ls
  min_saved: 85
  max_ms: 500
- name: app-log-50000
  run: |-
    awk 'BEGIN{for(i=1;i<=50000;i++) printf "2026-10-10T12:%02d:%02d.%03dZ INFO  worker-%d request id=%d path=/api/v1/items status=200 took=%dms\n",int(i/60)%60,i%60,i%1000,i%8,i,i%90; print "2026-10-10T13:00:00.000Z ERROR worker-3 request id=99999 failed: connection refused"}'
  attrs: { cmd: tail -n 50001 app.log }
  expect_type: log/app
  keep: ["ERROR worker-3 request id=99999 failed: connection refused"]
  min_saved: 90
  max_ms: 10000
- name: json-array-20000
  run: |-
    awk 'BEGIN{printf "["; for(i=1;i<=20000;i++){if(i>1)printf ","; printf "{\"id\":%d,\"name\":\"item%d\",\"status\":\"active\",\"tags\":[\"a\",\"b\"],\"price\":%d.5}",i,i,i%100}; print "]"}'
  attrs: { cmd: curl -s https://api.example.com/items }
  expect_type: data/json
  min_saved: 85
  max_ms: 2000
- name: ndjson-50000
  run: |-
    awk 'BEGIN{for(i=1;i<=50000;i++) printf "{\"ts\":%d,\"level\":\"info\",\"msg\":\"request done\",\"id\":%d,\"ms\":%d}\n",1700000000+i,i,i%90}'
  attrs: { cmd: cat events.ndjson }
  expect_type: data/ndjson
  min_saved: 85
  max_ms: 3000
- name: csv-50000
  run: |-
    awk 'BEGIN{print "id,name,email,country,amount"; for(i=1;i<=50000;i++) printf "%d,user%d,user%d@example.com,PL,%d.%02d\n",i,i,i,i%1000,i%100}'
  attrs: { cmd: cat users.csv }
  expect_type: data/csv
  min_saved: 85
  max_ms: 2000
- name: minified-json-1mb
  run: |-
    awk 'BEGIN{printf "{\"items\":["; for(i=1;i<=12000;i++){if(i>1)printf ","; printf "{\"id\":%d,\"payload\":\"%s\"}",i,"xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"}; print "]}"}'
  attrs: { cmd: curl -s https://api.example.com/dump }
  expect_type: data/json
  min_saved: 85
  max_ms: 1000
