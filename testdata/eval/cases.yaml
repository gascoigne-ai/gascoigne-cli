# Eval cases. Fixtures are real tool output where the tool was available
# (go, git, grep, rg, ls, npm, curl), realistic synthetic otherwise (nx, bun, logs).
#   attrs        hints as an agent wrapper would set them; omit to test pure detection
#   expect_type  block type(s) after optimization, family/dialect, "a+b" for multi-block
#                (detected type, except html which becomes doc/markdown)
#   keep         substrings that must survive optimization
#   min_saved    lowest acceptable saving, percent
# Goldens in golden/<name>.out; review diffs, then `gascoigne eval -update`.

# --- go
- file: go/test-pass.txt
  attrs: { cmd: go test ./... }
  expect_type: test/go
  keep: ["internal/service", "ok 16 packages"]
  min_saved: 60
- file: go/test-v-pass.txt
  attrs: { cmd: go test -v ./... }
  expect_type: test/go
