  min_saved: 45
- file: grep/rg.txt
  attrs: { cmd: rg -n "ctx context.Context" }
  expect_type: grep
  min_saved: 5
- file: grep/rg-errors.txt
  attrs: { cmd: rg -n -i error }
  expect_type: grep
  keep: ["active_help_test.go"]
  min_saved: 60
- name: detect/grep
  file: grep/grep-rn.txt
  expect_type: grep

# --- ls
- file: ls/usr-lib.txt
  attrs: { cmd: ls -la /usr/lib }
  expect_type: ls
  min_saved: 60
- file: ls/many-same-ext.txt
  attrs: { cmd: ls -la /usr/share/man/man1 }
  expect_type: ls
  min_saved: 60
- file: ls/repo.txt
