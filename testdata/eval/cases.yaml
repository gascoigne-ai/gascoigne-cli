  keep: ["\"full_name\"", "golang/", "\"_same\""]
  min_saved: 70
- file: json/package-lock.json
  attrs: { cmd: cat package-lock.json }
  expect_type: json
  keep: ["\"express\"", "node_modules/express"]
  min_saved: 40
- file: json/go-list-m.json
  attrs: { cmd: go list -m -json all }
  expect_type: json
  min_saved: 15
- file: log/structured.ndjson
  attrs: { cmd: kubectl logs api }
  expect_type: ndjson
  keep: ["card_declined: insufficient funds", "items omitted"]
  min_saved: 90
- name: detect/json
  file: json/github-repos.json
  expect_type: json

# --- html (web data)
- file: html/go-dev-layout.html
  attrs: { mime: text/html }
  expect_type: markdown
  keep: ["Organizing a Go module", "## ", "```"]
  min_saved: 70
- file: html/go-dev-blog.html
  attrs: { mime: text/html }
  expect_type: markdown
  keep: ["Routing Enhancements for Go 1.22", "## Precedence", "http.HandleFunc(\"GET /posts/{id}\", handlePost2)", "[GitHub discussion](https://github.com/golang/go/discussions/60227)"]
  min_saved: 70
- name: detect/html
  file: html/go-dev-blog.html
  expect_type: markdown

# --- log
- file: log/app.log
  attrs: { file: /var/log/shop/app.log }
  expect_type: log
  keep: ["pq: deadlock detected", "src/orders/repo.ts:142:11", "connection pool exhausted", "FATAL [main] shutting down", "upstream timeout", "(×60)"]
  min_saved: 90
- name: detect/log
  file: log/app.log
  expect_type: log

# --- mixed multi-block (e.g. several tool results in one request)
- name: mixed/json-log-diff
  blocks:
    - { file: json/github-repos.json, kind: tool_result }
    - { file: log/app.log, kind: tool_result }
    - { file: git/diff.txt, kind: tool_result }
  expect_type: json+log+diff
  keep: ["FATAL [main] shutting down", "func OnlyValidArgs", "\"_affix\""]
  min_saved: 60
