# Eval cases. Fixtures are real tool output where the tool was available
# (go, git, grep, rg, ls, npm, curl), realistic synthetic otherwise (nx, bun, logs).
#   attrs        hints as an agent wrapper would set them; omit to test pure detection
#   expect_type  block type(s) after optimization, "a+b" for multi-block
#                (detected type, except html which becomes markdown)
#   keep         substrings that must survive optimization
#   min_saved    lowest acceptable saving, percent
# Goldens in golden/<name>.out; review diffs, then `gascoigne eval -update`.

# --- go
- file: go/test-pass.txt
  attrs: { cmd: go test ./... }
  expect_type: go-test
  keep: ["internal/service", "ok 16 packages"]
  min_saved: 60
- file: go/test-v-pass.txt
  attrs: { cmd: go test -v ./... }
  expect_type: go-test
  min_saved: 85
- file: go/test-fail.txt
  attrs: { cmd: go test ./... }
  expect_type: go-test
  keep: ["--- FAIL: TestReserve", "panic: assignment to entry in nil map", "stock_test.go:7", "--- FAIL: TestTotal/negative_guard", "Total([1], 5) = -4, want 0", "FAIL\texample.com/shop/price"]
  min_saved: 40
- file: go/test-fail-v.txt
  attrs: { cmd: go test -v ./... }
  expect_type: go-test
  keep: ["--- FAIL: TestReserve", "stock_test.go:7", "Total([1], 5) = -4, want 0", "FAIL\texample.com/shop/inventory"]
  min_saved: 85
- file: go/test-json.ndjson
  attrs: { cmd: go test -json ./... }
  expect_type: go-test-json
  keep: ["TestReserve", "assignment to entry in nil map", "Total([1], 5) = -4, want 0"]
  min_saved: 95
- file: go/build-errors.txt
  attrs: { cmd: go build ./... }
  expect_type: go-build
  keep: ["broken/broken.go:15:9: undefined: undefinedHelper", "broken/broken.go:21:3"]
- name: detect/go-test-fail-v
  file: go/test-fail-v.txt
  expect_type: go-test
- name: detect/go-test-json
  file: go/test-json.ndjson
  expect_type: go-test-json

# --- git
- file: git/status.txt
  attrs: { cmd: git status }
  expect_type: git-status
  keep: ["internal/router/glob.go", "internal/router/match.go", "notes.txt", "ahead of 'origin/feature/router' by 3"]
  min_saved: 45
- file: git/status-big.txt
  attrs: { cmd: git status }
  expect_type: git-status
  keep: ["args.go -> arguments.go", "cobra.go", "yaml_docs_test.go", "internal/newpkg/b.go"]
  min_saved: 45
- file: git/log.txt
  attrs: { cmd: git log }
  expect_type: git-log
  keep: ["adbc881", "fix: resolve macOS test link failure"]
  min_saved: 65
- file: git/diff.txt
  attrs: { cmd: git diff HEAD~12 }
  expect_type: diff
  keep: ["args.go", "func OnlyValidArgs", "+func NoDuplicateArgs"]
  min_saved: 20
- file: git/show.txt
  attrs: { cmd: git show HEAD~17 }
  expect_type: diff
  min_saved: 10
- file: git/push.txt
  attrs: { cmd: git push -u origin feature/router }
  expect_type: git-remote
  keep: ["feature/router -> feature/router", "pull/new/feature/router"]
  min_saved: 60
- name: detect/git-log
  file: git/log.txt
  expect_type: git-log
- name: detect/git-diff
  file: git/diff.txt
  expect_type: diff

# --- grep
